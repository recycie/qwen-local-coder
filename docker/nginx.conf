user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/json;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_cf_connecting_ip $client_addr { default $http_cf_connecting_ip; '' $remote_addr; }
  limit_req_zone $client_addr zone=admin_login:10m rate=6r/m;
  limit_req_status 429;
  # Omit query strings and Authorization: UI redirects can contain login tokens.
  log_format safe '$client_addr $host "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log safe;
  client_max_body_size 16m;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1800s;
  proxy_send_timeout 1800s;
  send_timeout 1800s;
  proxy_redirect http://$host/ https://$host/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $client_addr;
  proxy_set_header X-Real-IP $client_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  add_header X-Accel-Buffering no always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Robots-Tag noindex always;

  server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { return 200 'ok'; }
    location / { return 404; }
  }
  server {
    listen 8080;
    server_name llm-api.cookeebit.cloud;
    set $gateway http://gateway:4000;
    location = / {
      return 200 '{"service":"LLM API","base_url":"https://llm-api.cookeebit.cloud/v1","authentication":"Bearer API key"}';
    }
    # Inference routes only. No UI, key management, spend logs or admin APIs.
    location ~ ^/v1/(models(/[^/]+)?|chat/completions|completions|responses(/[^/]+)?)$ {
      proxy_pass $gateway;
    }
    location / { return 404; }
  }
  server {
    listen 8080;
    server_name llm.cookeebit.cloud;
    set $gateway http://gateway:4000;
    location = / { return 302 https://llm.cookeebit.cloud/ui/; }
    location = /login {
      limit_req zone=admin_login burst=10 nodelay;
      proxy_pass $gateway;
    }
    location / { proxy_pass $gateway; }
  }
  server {
    listen 8080;
    server_name llm-infra.cookeebit.cloud;
    set $infra http://infra:9000;
    location = /api/auth {
      limit_req zone=admin_login burst=10 nodelay;
      proxy_pass $infra;
    }
    location / { proxy_pass $infra; }
  }
}
